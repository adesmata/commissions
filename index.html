<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@mewra</title>
<style>
:root{
  --bg:#050505;
  --fg:#e8e8e8;
  --line:#cfcfcf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:"Space Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  min-height:100vh;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:24px 30px;
}
.logo{font-size:20px;letter-spacing:.05em}
nav a{
  color:var(--fg);
  text-decoration:none;
  font-size:14px;
  letter-spacing:.08em;
  margin-left:34px;
  padding-bottom:4px;
  text-transform:uppercase;
}
nav a.on{border-bottom:2px solid var(--fg)}

main{padding:0 40px 90px}
h2{
  font-size:42px;
  font-weight:400;
  letter-spacing:.12em;
  margin:100px 0 36px;
  text-transform:uppercase;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:30px;
}
.tile{
  aspect-ratio:1.3/1;
  border:1px solid var(--line);
  background:#0b0b0b;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.sprites .tile{background:#000;border-color:#bdbdbd}
.sprites .tile img{
  object-fit:contain;
  image-rendering:pixelated;
  padding:14px;
}

@media(max-width:700px){
  header{padding:18px 20px}
  nav a{margin-left:18px}
  main{padding:0 20px 60px}
  h2{font-size:30px;margin:64px 0 24px}
  .grid{grid-template-columns:repeat(2,1fr);gap:18px}
}
</style>
</head>
<body>

<header>
  <div class="logo">@mewra</div>
  <nav>
    <a class="on" href="#">Home</a>
    <a href="#">Contact</a>
  </nav>
</header>

<main>
  <h2>Art</h2>
  <section class="grid art">
    <div class="tile"><img src="img/art/1.png" alt=""></div>
    <div class="tile"><img src="img/art/2.png" alt=""></div>
    <div class="tile"><img src="img/art/3.png" alt=""></div>
    <div class="tile"><img src="img/art/4.png" alt=""></div>
    <div class="tile"><img src="img/art/5.png" alt=""></div>
    <div class="tile"><img src="img/art/6.png" alt=""></div>
    <div class="tile"><img src="img/art/7.png" alt=""></div>
    <div class="tile"><img src="img/art/8.png" alt=""></div>
    <div class="tile"><img src="img/art/9.png" alt=""></div>
    <div class="tile"><img src="img/art/10.png" alt=""></div>
    <div class="tile"><img src="img/art/11.png" alt=""></div>
    <div class="tile"><img src="img/art/12.png" alt=""></div>
  </section>

  <h2>Sprites</h2>
  <section class="grid sprites">
    <div class="tile"><img src="img/sprites/1.png" alt=""></div>
    <div class="tile"><img src="img/sprites/2.png" alt=""></div>
    <div class="tile"><img src="img/sprites/3.png" alt=""></div>
    <div class="tile"><img src="img/sprites/4.png" alt=""></div>
    <div class="tile"><img src="img/sprites/5.png" alt=""></div>
    <div class="tile"><img src="img/sprites/6.png" alt=""></div>
    <div class="tile"><img src="img/sprites/7.png" alt=""></div>
    <div class="tile"><img src="img/sprites/8.png" alt=""></div>
  </section>
</main>

</body>
</html>
